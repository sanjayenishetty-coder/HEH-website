<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
  <title>HEH Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=20261031d">
  <link rel="stylesheet" href="admin.css?v=20261031d">
</head>
<body class="admin">
  <!-- Sign in -->
  <section class="login" data-login hidden>
    <form class="panel pad" id="login" novalidate>
      <div class="logo" style="justify-content:center"><img src="../assets/brand/logo.png" alt="Hyderabad Entrepreneurs Hub" width="448" height="136"></div>
      <h1 style="font-size:26px;text-align:center;margin:18px 0 22px">Admin Sign In</h1>
      <div class="field"><label for="username">Username</label><input class="input" id="username" name="username" autocomplete="username" value="admin"></div>
      <div class="field" style="margin-top:14px"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password"></div>
      <div class="form-error" hidden style="margin-top:14px"></div>
      <button class="btn btn-primary btn-block" style="margin-top:20px" type="submit">Sign In</button>
      <p style="margin-top:16px;text-align:center"><a class="link-arrow navy" href="../index.html">Back to website</a></p>
    </form>
  </section>

  <!-- App -->
  <div class="app" data-app hidden>
    <header class="topbar">
      <div class="brand"><img src="../assets/brand/logo.png" alt="Hyderabad Entrepreneurs Hub" width="448" height="136"><span class="tag">Admin</span></div>
      <nav class="tabs" data-tabs>
        <button data-tab="dashboard">Dashboard</button>
        <button data-tab="applications">Applications</button>
        <button data-tab="enquiries">Enquiries</button>
        <button data-tab="registrations">Registrations</button>
        <button data-tab="events">Events</button>
        <button data-tab="members">Members</button>
        <button data-tab="stories">Stories</button>
      </nav>
      <div class="right"><a href="../index.html" target="_blank" rel="noopener">View site</a><button class="btn btn-outline btn-sm" data-logout>Sign out</button></div>
    </header>
    <main class="workspace" data-view></main>
  </div>

  <div class="modal" data-editor hidden><div class="box wide" data-editor-box></div></div>
  <div class="toast" data-toast hidden></div>

  <script src="../js/site.js?v=20261031d"></script>
  <script src="admin.js?v=20261031d"></script>
</body>
</html>
