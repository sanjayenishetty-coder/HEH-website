<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Success Story | Hyderabad Entrepreneurs Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261031b">
</head>
<body data-nav="community">
  <header class="site-header"></header>
  <main data-story><div class="container loading" style="padding:120px 0">Loading story…</div></main>
  <footer class="site-footer"></footer>
  <script src="js/site.js?v=20261031b"></script>
  <script src="js/community.js?v=20261031b"></script>
  <script>
    (async () => {
      const { api, esc, fmt, icon, media, param, CATEGORY_BADGE } = HEH;
      const main = document.querySelector('[data-story]');
      const slug = param('s');
      if (!slug) return (location.href = 'success-stories.html');
      try {
        const s = await api(`/stories/${encodeURIComponent(slug)}`);
        document.title = `${s.title} | HEH Success Stories`;
        const facts = [
          (s.members_involved || []).length && ['users', 'Members Involved', s.members_involved.join(', ')],
          (s.companies || []).length && ['building', 'Companies', s.companies.join(', ')],
          s.business_category && ['briefcase', 'Business Category', s.business_category],
          ['calendar', 'Published On', fmt.date(s.published_on)],
        ].filter(Boolean);
        main.innerHTML = `
          <section class="page-hero" style="padding-bottom:28px"><div class="container">
            <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a>${icon('chevron-right')}<a href="community.html">Our Community</a>${icon('chevron-right')}<a href="success-stories.html">Success Stories</a>${icon('chevron-right')}<span>Story</span></nav>
            <span class="badge ${CATEGORY_BADGE[s.category] || ''}" style="margin-top:24px">${esc(s.category)}</span>
            <h1 style="font-size:clamp(32px,4.4vw,48px)">${esc(s.title)}</h1>
            <p class="lead">${esc(s.summary)}</p>
          </div></section>
          <section class="section tight"><div class="container article">
            ${s.image_url ? media(s.image_url, { label: s.title }) : ''}
            <div class="meta-strip" style="margin-bottom:24px">${facts.map(([ic, k, v]) => `<div>${icon(ic)}<span><span class="muted" style="font-weight:400;font-size:13px;display:block">${k}</span>${esc(v)}</span></div>`).join('')}</div>
            ${esc(s.body || s.summary).split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')}
          </div></section>
          <section class="section tight" style="padding-bottom:40px"><div class="container">
            <h2 class="title" style="margin-bottom:22px">More Success Stories</h2>
            <div class="card-grid" data-more-stories></div>
            <div class="btn-row center" style="margin-top:30px"><a class="btn btn-outline" href="success-stories.html">Back to Success Stories</a></div>
          </div></section>`;
        const more = await api(`/stories?limit=3&exclude=${encodeURIComponent(slug)}`);
        main.querySelector('[data-more-stories]').innerHTML = more.items.map(HEHCommunity.storyCard).join('');
      } catch (err) {
        main.innerHTML = `<section class="section"><div class="container empty">${err.status === 404 ? 'This story could not be found.' : esc(err.message)}<br><br><a class="btn btn-primary" href="success-stories.html">Back to Success Stories</a></div></section>`;
      }
    })();
  </script>
</body>
</html>
