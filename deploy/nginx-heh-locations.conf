# Added inside BOTH server blocks of /etc/nginx/sites-available/heh-prod (port 1501)
# and heh-domain (heh.visuprojects.in), above the existing "location / { ... }".

    location /api/ {
        proxy_pass http://127.0.0.1:1502;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Also: the existing "location / { ... }" has  add_header Cache-Control "no-cache";
    # so browsers re-check pages, CSS and JS (cheap 304s) and never show a stale design.

    # Images uploaded from /admin
    location /uploads/ {
        alias /srv/heh/prod/uploads/;
        expires 7d;
        add_header Cache-Control public;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
