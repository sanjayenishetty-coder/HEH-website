# nginx site for www.entrepreneurhub.in (see DEPLOYMENT.md, step 7).
# Copy to /etc/nginx/sites-available/heh, link it into sites-enabled, run `nginx -t`, then reload nginx.
# Certbot (step 9) adds the HTTPS (443) parts and the http -> https redirect to this file automatically.

# entrepreneurhub.in (no www) -> www.entrepreneurhub.in
server {
    listen 80;
    listen [::]:80;
    server_name entrepreneurhub.in;
    return 301 http://www.entrepreneurhub.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.entrepreneurhub.in;

    root /srv/heh/prod/frontend;          # the built website (web/dist)
    index index.html;
    access_log /var/log/nginx/heh-access.log;
    error_log  /var/log/nginx/heh-error.log;
    client_max_body_size 10m;             # image / document uploads (the API allows up to 5 MB)

    # Built JS/CSS (hashed names) and images shipped with the site
    location /assets/ {
        expires 1d;
        add_header Cache-Control public;
        try_files $uri =404;
    }

    # The Node.js API (systemd service heh-api, listening on 127.0.0.1:1502)
    location /api/ {
        proxy_pass http://127.0.0.1:1502;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Images uploaded in the admin panel and the Member Portal.
    # Member verification documents (uploads-documents) are private and must NOT be served here.
    location /uploads/ {
        alias /srv/heh/prod/uploads/;
        expires 7d;
        add_header Cache-Control public;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Pages: /about -> about.html, /admin/ and /portal/ -> their index.html. Browsers always re-check pages.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
